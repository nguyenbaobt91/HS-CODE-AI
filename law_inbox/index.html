<script>
(function(){
const D=window.LAW_DATA||{docs:[]}, docs=D.docs;
const chs=D.chs||[''], tds=D.tds||[''];
const rawArr=D.c||D.chunks||[];
const $=id=>document.getElementById(id);
const clean=s=>(s||'').normalize('NFC').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function fold(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase()}
const STOP=new Set('va la cua cho cac nhung mot duoc de khi thi tai trong voi khong nay do ve theo tu den nhu neu quy dinh hay hoac the nao nhieu gi sao bi se da dang tren duoi sau truoc phai can'.split(' '));
function splitToks(f){return f.split(/[^a-z0-9\/]+/).filter(x=>x)}
const today=new Date();
function pd(s){const m=(s||'').match(/(\d+)\/(\d+)\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function status(d){
  const h=d.hieu_luc||'', hMain=h.split('(')[0];
  if(/bãi bỏ bởi|đã bị bãi bỏ|hết hiệu lực/i.test(h)&&!/một phần|còn hiệu lực/i.test(hMain))return['bad','Hết hiệu lực'];
  const t=pd(d.ngay_hl);if(t&&t>today)return['warn','Chưa có hiệu lực ('+d.ngay_hl+')'];
  if(/một phần/i.test(hMain))return['warn','Còn hiệu lực một phần'];
  return['ok','Còn hiệu lực'];
}
docs.forEach(d=>{
  d._st=status(d);
  const dt=pd(d.ngay_hl)||pd(d.ngay),dn=pd(d.ngay);
  d._ts=dt?dt.getTime():0;d._dn=dn?dn.getTime():0;d._fut=dt&&dt>today?1:0;
  d._fso=fold(d.so||'');d._fnh=fold(d.nhan||'');
});
// Unpack compact array format lazily without duplicating text strings in RAM
const chunks=[];
for(let i=0;i<rawArr.length;i++){
  const r=rawArr[i];
  const c=Array.isArray(r)?{d:r[0],dieu:r[1],kh:r[2],td:tds[r[3]]||'',ch:chs[r[4]]||'',t:r[5]}:r;
  if(!docs[c.d]||docs[c.d].vaitro.startsWith('Phụ'))continue;
  c.len=c.t.length;c.i=chunks.length;
  chunks.push(c);
}
const N=chunks.length||1;
// Non-blocking chunked Inverted Index builder (tiết kiệm ~65% RAM, không đơ máy khi mở trang)
const inv=new Map();
let idxPos=0, idxReady=false, pendingRun=false;
function indexBatch(){
  const end=Math.min(idxPos+450,chunks.length);
  for(let i=idxPos;i<end;i++){
    const c=chunks[i];
    const seen=new Set(splitToks(fold(c.t+' '+c.td)));
    seen.forEach(t=>{let a=inv.get(t);if(!a){a=[];inv.set(t,a)}a.push(i)});
  }
  idxPos=end;
  if(idxPos<chunks.length){setTimeout(indexBatch,0)}
  else{idxReady=true;if(pendingRun){pendingRun=false;run()}}
}
setTimeout(indexBatch,0);
const idf=t=>Math.log(1+N/(((inv.get(t)||[]).length)+0.5));
function label(c){const d=docs[c.d];let s='';if(c.kh)s+='khoản '+c.kh+' ';if(c.dieu)s+='Điều '+c.dieu+' ';else s+=c.td+' ';return s+d.nhan}
function cite(c){const d=docs[c.d];let s='Căn cứ '+label(c);if(d.vaitro!=='Văn bản gốc'&&d.sua_doi)s+=' (sửa đổi, bổ sung '+d.sua_doi+')';return s}
const ABBR={cssx:'co so san xuat',sxxk:'san xuat xuat khau',xnk:'xuat nhap khau',nk:'nhap khau',xk:'xuat khau',tthq:'thu tuc hai quan',stq:'sau thong quan',hq:'hai quan','c/o':'chung nhan xuat xu',kcx:'khu che xuat',dncx:'doanh nghiep che xuat',txtn:'tam xuat tai nhap',tntx:'tam nhap tai xuat',ktcn:'kiem tra chuyen nganh',vphc:'vi pham hanh chinh'};
const KEEP1=new Set(['diem','mau','form','khoan','phu']);
function expandWord(w){const k=fold(w).replace(/[^a-z0-9\/]/g,'');return ABBR[k]||w}
function expandStr(s){return s.split(/\s+/).map(expandWord).join(' ')}
function matchDocRef(q){

const tb=$('themeBtn'),syncT=()=>{const dk=document.documentElement.classList.contains('dark');tb.innerHTML=dk?SUN:MOON};
syncT();tb.onclick=()=>{const dk=document.documentElement.classList.toggle('dark');try{localStorage.setItem('law_theme',dk?'dark':'light');localStorage.setItem('hscoder_theme',dk?'dark':'light')}catch(e){}syncT()};
// danh mục
(function(){
  const groups=['Văn bản gốc','Văn bản hợp nhất','Văn bản sửa đổi, bổ sung'];
  const nDocs=docs.filter(d=>!d.vaitro.startsWith('Phụ')).length;
  let h='<div class="meta">Bấm vào một dòng để tra cứu trong văn bản đó. Tổng <b>'+nDocs+'</b> văn bản, <b>'+chunks.length.toLocaleString('vi-VN')+'</b> đoạn.</div>';
  groups.forEach(g=>{
    const xs=docs.map((d,i)=>[d,i]).filter(x=>x[0].vaitro===g);if(!xs.length)return;
    h+='<h3>'+g+' ('+xs.length+')</h3><div class="tw"><table><tr><th style="white-space:nowrap">Văn bản</th><th>Tên</th><th>Lĩnh vực</th><th style="white-space:nowrap">Ban hành</th><th>Tình trạng</th><th style="white-space:nowrap">Sửa đổi cho</th></tr>'+
      xs.map(([d,i])=>'<tr class="cl" onclick="LAW.doc('+i+')"><td style="white-space:nowrap"><b>'+esc(d.nhan)+'</b></td><td>'+esc(d.ten)+'</td><td>'+d.nhom.join(', ')+'</td><td style="white-space:nowrap">'+esc(d.ngay)+'</td><td><span class="chip '+d._st[0]+'">'+d._st[1]+'</span><div class="sub">'+esc(d.hieu_luc)+'</div></td><td>'+esc(d.sua_doi||'-')+'</td></tr>').join('')+'</table></div>';
  });
  $('pD').innerHTML='<input id="dsearch" placeholder="Lọc danh mục theo số hiệu / tên...">'+h;
  const rows=[...document.querySelectorAll('#pD tr.cl')];rows.forEach(r=>r.dataset.f=fold(r.textContent));
  $('dsearch').oninput=function(){const v=fold(this.value);rows.forEach(r=>r.style.display=r.dataset.f.includes(v)?'':'none')};
})();
// văn bản đính kèm
(function(){
  const withFile=docs.map((d,i)=>[d,i]).filter(x=>x[0].file&&!x[0].vaitro.startsWith('Phụ'));
  const rows=withFile.map(([d,i],idx)=>'<tr class="frow"><td>'+(idx+1)+'</td><td><b>'+esc(d.nhan)+'</b><div class="sub">'+esc(d.ten)+'</div><div style="margin-top:3px">'+chips(d)+'</div></td>'+
    '<td style="white-space:nowrap"><div>'+esc(d.ngay||'—')+'</div><div class="sub">Hiệu lực: '+esc(d.ngay_hl||d.ngay||'—')+'</div></td>'+
    '<td><div class="fn">'+esc(d.file)+'</div></td>'+
    '<td style="white-space:nowrap"><div style="display:flex;gap:6px;flex-wrap:wrap"><a class="a" href="'+encodeURIComponent(d.file)+'" target="_blank">📂 Mở file gốc</a><button class="a" onclick="LAW.readDoc('+i+')">📖 Đọc nhanh</button></div></td></tr>').join('');
  $('pF').innerHTML='<div class="fbar"><input id="fsearch" placeholder="Tìm văn bản đính kèm theo số hiệu, tên, tên file..."><div class="meta" style="margin:0">Tổng <b>'+withFile.length+'</b> văn bản gốc đính kèm (bấm <b>Mở file gốc</b> để tải/mở bằng Word đối chiếu).</div></div>'+
    '<div class="tw"><table><tr><th style="width:42px">#</th><th>Văn bản</th><th style="width:130px;white-space:nowrap">Ban hành / HL</th><th style="width:230px">Tên file trong thư mục</th><th style="width:210px">Đối chiếu</th></tr>'+rows+'</table></div>';
  const frows=[...document.querySelectorAll('#pF tr.frow')];frows.forEach(r=>r.dataset.f=fold(r.textContent));
  $('fsearch').oninput=function(){const v=fold(this.value);frows.forEach(r=>r.style.display=r.dataset.f.includes(v)?'':'none')};
})();
drawH();
const hm=location.hash.match(/^#q=(.+)/);if(hm){$('q').value=decodeURIComponent(hm[1]);run()}
})();
